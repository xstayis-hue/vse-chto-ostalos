<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030507" />
    <title>Всё, что от меня ОСТАЛОСЬ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <filter id="warp" x="-5%" y="-10%" width="110%" height="120%">
   <feTurbulence type="fractalNoise" baseFrequency="0.035 0.6" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      <filter id="rough" x="-5%" y="-20%" width="110%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
      </svg>
      <section id="stage"></section>
      <div id="grain" aria-hidden="true"></div>
      <div id="vignette" aria-hidden="true"></div>
      <div id="flash" aria-hidden="true"></div>
    </main>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="assets/three.min.js"></script>
    <script src="content.js?v=2"></script>
    <script src="pixel-memories.js?v=2"></script>
    <script src="flight.js?v=1"></script>
    <script src="app.js?v=5"></script>
  </body>
</html>
