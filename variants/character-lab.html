<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Архив — проба персонажа</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #090e0e; color: #d6dfd9; font-family: Georgia, serif; display: grid; place-items: center; }
    main { width: min(100%, 420px); padding: 20px; }
    header { font: 12px/1.5 monospace; letter-spacing: .12em; color: #a4b4ac; }
    .scene { position: relative; overflow: hidden; aspect-ratio: 3 / 4; max-height: 500px; margin: 16px 0; background: #101a1c; border: 1px solid #52605a; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .figure { position: absolute; width: 76%; max-width: 280px; bottom: -3%; left: 50%; transform: translateX(-50%); }
    .body { transform-origin: 50% 100%; animation: breathe 5s ease-in-out infinite; }
    .eyes { transform-origin: 50% 50%; animation: blink 7s step-end infinite; }
    .child .adult-only, .adult .child-only { display: none; }
    .adult .figure { width: 88%; max-width: 320px; }
    .caption { font-size: 18px; line-height: 1.5; min-height: 3em; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    button { min-height: 44px; border: 1px solid #788d83; background: #101a19; color: #e0e9e1; padding: 10px 16px; font: 14px monospace; }
    button[aria-pressed="true"] { background: #31413b; }
    .note { color: #aab8b1; font: 12px/1.6 monospace; }
    @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.008); } }
    @keyframes blink { 0%,47%,49%,100% { transform: scaleY(1); } 48% { transform: scaleY(.08); } }
    @media (prefers-reduced-motion: reduce) { .body, .eyes { animation: none; } }
  </style>
</head>
<body>
<main>
  <header>ПРОБА ПЕРСОНАЖА / ОДНА ЖИЗНЬ</header>
  <div class="scene child" id="scene">
    <canvas id="pixel" width="240" height="320" role="img" aria-label="Пиксельная сцена воспоминания"></canvas>
  </div>
  <p class="caption" id="caption">Семь лет. На кухне кто-то тихо пел.</p>
  <div class="controls"><button id="child" aria-pressed="true">Детство</button><button id="adult" aria-pressed="false">Взрослая жизнь</button></div>
  <p class="note">Черновой пиксельный эскиз: две сцены одной жизни. Это проба стиля, не готовый набор персонажей.</p>
</main>
<script>
  const scene = document.querySelector('#scene');
  const caption = document.querySelector('#caption');
  const ctx = document.querySelector('#pixel').getContext('2d');
  function draw(age) {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    const rect = (x,y,w,h,c) => { ctx.fillStyle=c; ctx.fillRect(x,y,w,h); };
    rect(0,0,120,160,'#172629');
    if (age === 'child') {
      rect(0,0,120,100,'#34474a'); rect(8,12,53,66,'#182527'); rect(12,16,45,58,'#81918d');
      rect(33,16,4,58,'#293a3b'); rect(12,42,45,4,'#293a3b');
      rect(14,18,17,22,'#a2b0a5'); rect(39,18,16,22,'#95a8a0');
      rect(0,99,120,61,'#263333'); rect(10,94,100,8,'#635f4f'); rect(18,102,5,58,'#484a40'); rect(101,102,5,58,'#484a40');
      rect(75,84,28,11,'#b1aa8c'); rect(82,88,12,2,'#6d7771');
      rect(51,50,19,21,'#272c29'); rect(49,57,23,10,'#292e2b'); rect(53,64,17,15,'#b4a590');
      rect(55,65,5,11,'#d0bea5'); rect(58,79,9,6,'#9b8d7c'); rect(43,85,34,33,'#4a5c57');
      rect(45,86,8,31,'#394b49'); rect(70,87,7,21,'#394b49'); rect(72,104,13,5,'#b4a590');
      rect(48,118,25,25,'#293633'); rect(49,143,9,17,'#1b2928'); rect(65,143,9,17,'#1b2928');
    } else {
      rect(0,0,120,96,'#647879'); rect(0,0,120,20,'#27393d'); rect(0,95,120,65,'#283638');
      rect(0,88,120,7,'#606a61'); rect(80,33,40,67,'#3c5552'); rect(85,42,30,21,'#85938a');
      for(let x=87;x<115;x+=10) rect(x,42,2,21,'#354a48');
      rect(10,20,4,79,'#303c39'); rect(7,22,10,4,'#9e8c65');
      rect(50,43,19,23,'#272c29'); rect(49,54,21,11,'#292e2b'); rect(54,62,15,17,'#af9c89');
      rect(56,77,10,7,'#8e8274'); rect(42,84,39,48,'#344743'); rect(43,90,8,36,'#293a38');
      rect(72,90,9,36,'#293a38'); rect(48,132,12,28,'#1b2928'); rect(64,132,12,28,'#1b2928');
    }
    // Мелкие детали нарисованы на сетке вдвое плотнее базовой сцены.
    if (age === 'child') {
      rect(15, 21, .5, 19, '#c5d0be'); rect(42, 20, .5, 20, '#bac9bb');
      rect(78, 87, 10, .5, '#e0d4ad'); rect(81, 89, 8, .5, '#6e7d77');
      rect(54, 59, 7, .5, '#555751'); rect(46, 92, 1, 18, '#68776e');
    } else {
      rect(85, 66, 34, 1, '#98a59a'); rect(11, 34, 1, 45, '#52605a');
      rect(50, 47, 12, .5, '#59605a'); rect(45, 93, 1, 27, '#53655d');
    }
    for (let y=0;y<160;y+=4) rect(0,y,120,.5,'#07101218');
  }
  draw('child');
  for (const age of ['child', 'adult']) document.querySelector('#' + age).addEventListener('click', () => {
    scene.className = 'scene ' + age;
    caption.textContent = age === 'child' ? 'Семь лет. На кухне кто-то тихо пел.' : 'Двадцать четыре года. Поезд ещё стоял у платформы.';
    draw(age);
    document.querySelector('#child').setAttribute('aria-pressed', age === 'child');
    document.querySelector('#adult').setAttribute('aria-pressed', age === 'adult');
  });
</script>
</body>
</html>
